[pytest]
# Restrict test discovery to DroneSwarm test suites
testpaths = DroneOS/tests tests ml/tests

# Collect only standard test files starting with test_
python_files = test_*.py

# Avoid searching build artifacts, SDKs, virtual environments, and datasets
norecursedirs =
    AirSim
    scripts
    deploy
    runs
    ml/data
    mobile
    .venv
    .venv-gpu
    venv
    env
    node_modules
    .git
    .pytest_cache

# Register markers to eliminate unknown mark warnings
markers =
    unit: Isolated unit tests (default suite)
    integration: Integration tests requiring network or cross-component orchestration
    hardware: Tests requiring physical hardware, serial ports, or companion computers
    airsim: Tests requiring live AirSim simulation RPC connection
    slow: Long-running or performance benchmark tests

# Filter known external deprecation warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::pytest.PytestUnknownMarkWarning

